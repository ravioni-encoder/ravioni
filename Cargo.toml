[package]
name = "ravioni"
version = "0.8.0"
edition = "2021"

[dependencies]

ffmpeg-sidecar = "2.3"
anyhow = "1"
slint = "=1.13.1"
rfd = "0.16"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
dirs = "6.0.0"
serde = "1"
toml = "0.9"
serial_test = "3"
isolang = { version = "2.4", features = [
    "english_names",
    "lowercase_names",
    "local_names",
    "list_languages",
] }
regex = "1"
rand = "0.9"
whatlang = "0.18"


[build-dependencies]
slint-build = "=1.13.1"


[dev-dependencies]
indoc = "2"
mockall = "0.14"
tempfile = "3"
